<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SolarX Map Focus</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; width: 100%; }
    .popup-title { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
    .popup-row { display: flex; gap: 8px; font-size: 13px; margin: 4px 0; }
    .popup-row span:first-child { width: 26px; }
    .popup-muted { color: #666; font-size: 12px; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    // --- init map ---
    const map = L.map("map", { zoomControl: true }).setView([46.2, 6.1], 10);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    // Expose globally (useful for debugging)
    window.map = map;

    // --- marker rouge + popup ---
    let focusMarker = null;

    const redIcon = new L.Icon({
      iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png",
      shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    function buildPopupHTML(payload) {
      const name = payload?.name || "Zone sélectionnée";
      const address = payload?.address || "Adresse indisponible";

      const t = payload?.temperature ?? "—";
      const p = payload?.precipitation ?? "—";
      const irr = payload?.irradiance ?? "—";
      const sun = payload?.ensoleillement ?? "—";
      const prod = payload?.production ?? "—";

      return `
        <div class="popup-title">📍 ${escapeHtml(name)}</div>
        <div class="popup-muted">${escapeHtml(address)}</div>
        <hr style="margin:8px 0;">
        <div class="popup-row"><span>🌡️</span><div>Température : <b>${escapeHtml(String(t))}</b> °C</div></div>
        <div class="popup-row"><span>🌧️</span><div>Précipitations : <b>${escapeHtml(String(p))}</b> mm</div></div>
        <div class="popup-row"><span>🔆</span><div>Irradiance : <b>${escapeHtml(String(irr))}</b> kWh/m²</div></div>
        <div class="popup-row"><span>☀️</span><div>Ensoleillement : <b>${escapeHtml(String(sun))}</b> h/j</div></div>
        <div class="popup-row"><span>⚡</span><div>Production : <b>${escapeHtml(String(prod))}</b> kWh</div></div>
        <div class="popup-muted">Données : point GPS le plus proche + dernière mesure disponible</div>
      `;
    }

    function escapeHtml(str) {
      return str
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function applyFocus(payload) {
      const lat = Number(payload?.lat);
      const lon = Number(payload?.lon);
      const zoom = Number(payload?.zoom ?? 13);

      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

      map.setView([lat, lon], zoom, { animate: true });

      if (focusMarker) {
        map.removeLayer(focusMarker);
      }

      const popupHtml = buildPopupHTML(payload);
      focusMarker = L.marker([lat, lon], { icon: redIcon }).addTo(map);
      focusMarker.bindPopup(popupHtml, { closeButton: true, autoClose: false, closeOnClick: false });

      // Ouvre automatiquement la popup
      focusMarker.openPopup();
    }

    // --- écoute postMessage depuis Dash ---
    window.addEventListener("message", (event) => {
      const msg = event?.data;
      if (!msg) return;

      // Supporte 2 formats: {type:"ZOOM_TO", payload:{...}} ou direct {type:"FOCUS_TO"...}
      if (msg.type === "ZOOM_TO" || msg.type === "FOCUS_TO") {
        applyFocus(msg.payload || {});
      }
    });
  </script>
</body>
</html>
