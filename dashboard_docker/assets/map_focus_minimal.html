<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SolarX Map Focus</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    .wrap { height: 100%; display: grid; grid-template-columns: 1.6fr 1fr; gap: 10px; padding: 10px; box-sizing: border-box; background: #f6f8ff; }
    #map { height: 100%; min-height: 320px; border-radius: 14px; overflow: hidden; border: 1px solid #e9ecf5; background: #fff; }
    .panel { background: #fff; border-radius: 14px; border: 1px solid #e9ecf5; padding: 12px; overflow: auto; }
    .title { font-weight: 900; margin: 0 0 10px; }
    .sub { opacity: .7; font-size: 12px; margin-bottom: 10px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .card { background: #f7f9ff; border-radius: 12px; padding: 10px; }
    .k { font-size: 12px; opacity: .75; }
    .v { font-size: 16px; font-weight: 800; margin-top: 2px; }
    .err { background: #fff1f2; border: 1px solid #fecdd3; padding: 10px; border-radius: 12px; color: #9f1239; }
    @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  </style>
</head>

<body>
  <div class="wrap">
    <div id="map"></div>

    <div class="panel">
      <h3 class="title">📊 Indicateurs</h3>
      <div class="sub" id="placeLabel">—</div>

      <div id="errorBox" class="err" style="display:none;"></div>

      <div class="grid" id="metricsGrid">
        <div class="card"><div class="k">Température</div><div class="v" id="m_temp">—</div></div>
        <div class="card"><div class="k">Précipitations</div><div class="v" id="m_prec">—</div></div>
        <div class="card"><div class="k">Irradiance</div><div class="v" id="m_irr">—</div></div>
        <div class="card"><div class="k">Ensoleillement</div><div class="v" id="m_ens">—</div></div>
        <div class="card"><div class="k">Dernière collecte</div><div class="v" id="m_date">—</div></div>
      </div>
    </div>
  </div>

<script>
  function q(name, fallback=null){
    const u = new URL(window.location.href);
    return u.searchParams.get(name) ?? fallback;
  }

  const name = q("name", "");
  const lat = parseFloat(q("lat", "0"));
  const lon = parseFloat(q("lon", "0"));
  const zoom = parseInt(q("zoom", "12"), 10);

  document.getElementById("placeLabel").textContent = name ? ("Lieu: " + name) : "Lieu: —";

  // Init map
  const map = L.map("map", { zoomControl: true }).setView([lat, lon], zoom);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  const marker = L.marker([lat, lon]).addTo(map);
  if (name) marker.bindPopup(`<b>${name}</b><br/>Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)}`).openPopup();
  else marker.bindPopup(`Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)}`).openPopup();

  function setMetric(id, value, unit=""){
    const el = document.getElementById(id);
    if (!el) return;
    if (value === null || value === undefined || value === "") el.textContent = "—";
    else el.textContent = `${value}${unit}`;
  }

  async function loadMetrics(){
    try{
      // On appelle ton backend Dash/Flask (à ajouter) : /api/metrics?name=...
      // Si tu préfères passer idpoint: /api/metrics?idpoint=123
      const url = name
        ? `/api/metrics?name=${encodeURIComponent(name)}`
        : `/api/metrics?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`;

      const res = await fetch(url);
      if (!res.ok) throw new Error("API metrics non disponible");
      const data = await res.json();

      setMetric("m_temp", data.temperature, " °C");
      setMetric("m_prec", data.precipitation, " mm");
      setMetric("m_irr", data.irradiance, " kWh/m²/j");
      setMetric("m_ens", data.ensoleillement_h, " h");
      setMetric("m_date", data.date_collecte, "");
    }catch(e){
      const box = document.getElementById("errorBox");
      box.style.display = "block";
      box.textContent = "Impossible de charger les métriques (API manquante). La carte fonctionne quand même.";
      console.warn(e);
    }
  }

  loadMetrics();
</script>
</body>
</html>
